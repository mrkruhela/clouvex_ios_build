workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: stable
    scripts:
      - name: Flutter clean
        script: flutter clean

      - name: Get packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod install

      - name: Build iOS
        script: flutter build ios --release --no-codesign