workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Change project directory
        script: cd Clouvex_Project

      - name: Flutter clean
        script: flutter clean

      - name: Get packages
        script: flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build IPA
        script: flutter build ipa --release --no-codesign

    artifacts:
      - Clouvex_Project/build/ios/ipa/*.ipa