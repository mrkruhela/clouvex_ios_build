workflows:
  ios-workflow:
    name: iOS IPA build
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter clean
        script: flutter clean

      - name: Get packages
        script: flutter pub get

      - name: Remove old pods
        script: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock

      - name: Install CocoaPods
        script: |
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod install

      - name: Build IPA
        script: flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa