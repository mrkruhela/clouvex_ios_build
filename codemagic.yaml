workflows:
  ios-workflow:
    name: iOS IPA build
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Set project directory
        script: cd Clouvex_Project

      - name: Flutter clean
        script: |
          cd Clouvex_Project
          flutter clean

      - name: Get packages
        script: |
          cd Clouvex_Project
          flutter pub get

      - name: Install pods
        script: |
          cd Clouvex_Project/ios
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          pod install --repo-update

      - name: Build IPA
        script: |
          cd Clouvex_Project
          flutter build ipa --release --no-codesign

    artifacts:
      - Clouvex_Project/build/ios/ipa/*.ipa