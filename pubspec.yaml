name: bedrive
description: Mobile application for BeDrive.
publish_to: 'none'

version: 1.1.3

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  flutter_hooks: ^0.21.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.17
  freezed_annotation: ^3.0.0
  hooks_riverpod: ^2.6.1
  http: ^1.3.0
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  package_info_plus: ^8.3.0
  yaml: ^3.1.3
  equatable: ^2.0.7
  background_downloader: ^9.2.0
  file_picker: ^9.2.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.0.0
  firebase_messaging: ^15.2.4
  firebase_core: ^3.12.1
  intl: any
  email_validator: ^3.0.0
  device_info_plus: ^11.3.3
  flutter_native_splash: ^2.4.5
  shared_preferences: ^2.5.2
  google_sign_in: ^6.3.0
  shimmer: ^3.0.0
  flutter_contacts: ^1.1.9+2
  date_field: ^6.0.3
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  open_file: ^3.5.1
  video_player: ^2.9.3
  chewie: ^1.11.0
  flutter_pdfview: ^1.4.0
  webview_flutter: ^4.10.0
  path: ^1.9.1
  path_provider: ^2.1.5
  drift: ^2.26.0
  drift_dev: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  sqlite3: ^2.7.5
  uuid: ^4.5.1
  background_fetch: ^1.3.8
  flutter_launcher_icons: ^0.14.3
  sentry_flutter: ^8.14.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  freezed: ^3.0.4
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/logos/
    - assets/social-logos/
    - assets/config/
    - app_config.yaml

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/logos/android-app-icon.png"
  image_path_ios: "assets/logos/ios-app-icon.png"
  adaptive_icon_background: "#1565c0"
  adaptive_icon_foreground: "assets/logos/android-app-icon.png"